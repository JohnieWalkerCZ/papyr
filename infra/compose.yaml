services:
  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_TLDRAW_LICENSE_KEY: ${NEXT_PUBLIC_TLDRAW_LICENSE_KEY:-}
        PAPYR_API_ORIGIN: http://api:8080
    pull_policy: build
    ports:
      - "${PAPYR_WEB_PORT:-6767}:3000"
    networks:
      papyr:
        ipv4_address: ${PAPYR_WEB_IP:-10.253.0.2}
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_TLDRAW_LICENSE_KEY: ${NEXT_PUBLIC_TLDRAW_LICENSE_KEY:-}
    depends_on:
      api:
        condition: ${PAPYR_API_START_CONDITION:-service_healthy}

  # Optional TLS entrypoint (Compose profile "tls"). Terminates HTTPS with an
  # automatic Let's Encrypt certificate and forwards one public origin to the
  # web service. HTTPS is required for PWA installation: browsers only
  # register the service worker (and offer "Install app") in a secure context.
  # Enable with: docker compose --profile tls up -d --build (from infra/),
  # with PAPYR_DOMAIN set to a public DNS name and PAPYR_COOKIE_SECURE=true.
  proxy:
    image: caddy:2.10-alpine
    profiles: ["tls"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - papyr-caddy-data:/data
      - papyr-caddy-config:/config
    environment:
      PAPYR_DOMAIN: ${PAPYR_DOMAIN:?Set PAPYR_DOMAIN to a public DNS name pointing at this host to enable the "tls" profile}
    networks:
      papyr:
        ipv4_address: ${PAPYR_PROXY_IP:-10.253.0.5}
    depends_on:
      web:
        condition: service_started
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: apps/api/Papyr.Api/Dockerfile
    pull_policy: build
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ "$${PAPYR_API_DIAGNOSTICS:-false}" = "true" ]; then
          echo "Papyr API diagnostic mode; architecture=$$(uname -m)"
          dotnet --info
          dotnet Papyr.Api.dll
          code=$$?
          echo "Papyr API exited with code $$code; holding container for Portainer log inspection."
          sleep 3600
          exit "$$code"
        fi
        exec dotnet Papyr.Api.dll
    environment:
      ConnectionStrings__Papyr: Host=db;Database=papyr;Username=papyr
      PGPASSWORD: ${PAPYR_DB_PASSWORD:-papyr-dev-only}
      # Recreate the API when the operator toggles recovery so startup migrations retry.
      PAPYR_RESET_DB_PASSWORD: ${PAPYR_RESET_DB_PASSWORD:-false}
      PAPYR_ADMIN_USERNAME: ${PAPYR_ADMIN_USERNAME:-}
      PAPYR_ADMIN_PASSWORD: ${PAPYR_ADMIN_PASSWORD:-}
      PAPYR_API_DIAGNOSTICS: ${PAPYR_API_DIAGNOSTICS:-false}
      PAPYR_INITIAL_SETUP_TOKEN: ${PAPYR_INITIAL_SETUP_TOKEN:-}
      PAPYR_COOKIE_SECURE: ${PAPYR_COOKIE_SECURE:-false}
      PAPYR_CHANGE_RETENTION_DAYS: ${PAPYR_CHANGE_RETENTION_DAYS:-90}
      PAPYR_MIGRATE_ON_STARTUP: ${PAPYR_MIGRATE_ON_STARTUP:-true}
      PAPYR_TRUSTED_PROXIES: ${PAPYR_WEB_IP:-10.253.0.2}
      PAPYR_MAX_ASSET_STORAGE_BYTES: ${PAPYR_MAX_ASSET_STORAGE_BYTES:-1073741824}
      PAPYR_ASSET_STORAGE_PATH: /data/assets
    volumes:
      - papyr-assets:/data/assets
    ports:
      - "127.0.0.1:5080:8080"
    networks:
      papyr:
        ipv4_address: ${PAPYR_API_IP:-10.253.0.3}
    depends_on:
      db:
        condition: service_healthy
      db-password-reset:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8080'"]
      interval: 5s
      timeout: 3s
      retries: 20

  db-password-reset:
    image: postgres:17.6-alpine
    user: postgres
    network_mode: none
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        if [ "$${PAPYR_RESET_DB_PASSWORD:-false}" != "true" ]; then
          echo "Database password reset disabled."
          exit 0
        fi
        : "$${POSTGRES_PASSWORD:?Set PAPYR_DB_PASSWORD before enabling password reset}"
        if [ "$$(printf '%s' "$$POSTGRES_PASSWORD" | wc -l)" -ne 0 ]; then
          echo "Database password reset requires a single-line password." >&2
          exit 1
        fi
        printf '%s\n%s\n' "$$POSTGRES_PASSWORD" "$$POSTGRES_PASSWORD" |
          psql -X -w -v ON_ERROR_STOP=1 -h /var/run/postgresql -U papyr -d papyr -c '\password papyr'
        echo "Database role password updated; database contents preserved."
    environment:
      PAPYR_RESET_DB_PASSWORD: ${PAPYR_RESET_DB_PASSWORD:-false}
      POSTGRES_PASSWORD: ${PAPYR_DB_PASSWORD:-}
    volumes:
      - papyr-db-socket:/var/run/postgresql
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: papyr
      POSTGRES_USER: papyr
      POSTGRES_PASSWORD: ${PAPYR_DB_PASSWORD:-papyr-dev-only}
    volumes:
      - papyr-postgres:/var/lib/postgresql/data
      - papyr-db-socket:/var/run/postgresql
    networks:
      papyr:
        ipv4_address: ${PAPYR_DB_IP:-10.253.0.4}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U papyr -d papyr"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  papyr-postgres:
  papyr-assets:
  papyr-db-socket:
  papyr-caddy-data:
  papyr-caddy-config:

networks:
  papyr:
    ipam:
      config:
        - subnet: ${PAPYR_NETWORK_SUBNET:-10.253.0.0/24}
